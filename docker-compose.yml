services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:./dev.db"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "3000"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./dev.db:/app/dev.db
    depends_on:
      - redis
    restart: unless-stopped
